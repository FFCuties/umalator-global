name: Sync Alpha123 Global and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'alpha123/uma-tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Fetch current Alpha123 Global
        uses: actions/checkout@v6
        with:
          repository: alpha123/uma-tools
          ref: master
          path: upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /skill_meta.json
            /umas.json
            /umalator-global/
            /umalator/bundle.js
            /umalator/simulator.worker.js
            /umalator/app.tsx
            /components/HorseDef.tsx
            /components/HorseDefTypes.ts
      - name: Build and test
        run: |
          python3 scripts/prepare.py upstream --sha "$(git -C upstream rev-parse HEAD)"
          node --check dist/bundle.js
          node --check dist/simulator.worker.js
          node --test scripts/smoke.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
